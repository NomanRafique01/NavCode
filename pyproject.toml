[project]
name = "navcode"
version = "0.1.0"
description = "Codebase intelligence layer for AI coding agents — 80-90% token reduction"
authors = [{name = "Noman Rafique", email = "nomanrafique01@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "agents", "context", "codebase", "tokens", "mcp", "claude", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "tree-sitter>=0.22.0",
    "fastmcp>=0.4.0",
    "SQLAlchemy>=2.0.0",
]

[project.scripts]
navcode = "navcode.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"
