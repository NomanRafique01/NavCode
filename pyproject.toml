[project]
name = "navcode"
version = "0.1.1"
description = "Codebase intelligence layer for AI coding agents — 80-90% token reduction"
authors = [{name = "Noman Rafique", email = "nomanrafique01@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "agents", "context", "codebase", "tokens", "mcp", "claude", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
    "networkx>=3.3.0",
    "tree-sitter>=0.22.0",
    "fastmcp>=0.4.0",
    "SQLAlchemy>=2.0.0",
    # tree-sitter language packs
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-cpp>=0.22.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-php>=0.22.0",
    "tree-sitter-swift>=0.6.0",
    "tree-sitter-kotlin>=0.3.0",
    "tree-sitter-scala>=0.21.0",
    "tree-sitter-haskell>=0.21.0",
    "tree-sitter-lua>=0.1.0",
    "tree-sitter-bash>=0.21.0",
    "tree-sitter-html>=0.20.0",
    "tree-sitter-css>=0.21.0",
    "tree-sitter-json>=0.21.0",
    "tree-sitter-yaml>=0.6.0",
    "tree-sitter-toml>=0.6.0",
    "tree-sitter-markdown>=0.3.0",
    "tree-sitter-sql>=0.2.0",
    "tree-sitter-regex>=0.21.0",
]

[project.scripts]
navcode = "navcode.cli:app"

[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"
